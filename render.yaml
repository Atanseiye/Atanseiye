services:
  - type: web
    name: accessflow-ai-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NATLAS_MODE
        value: mock
      - key: DEMO_MAX_TRANSFER
        value: "250000"
