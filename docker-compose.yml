services:
  accessflow:
    build: .
    ports:
      - "8000:8000"
    environment:
      NATLAS_MODE: mock
      DEMO_PIN: "1234"
      DEMO_MAX_TRANSFER: "250000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 4
